[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zeebountee"
version = "1.0.0"
description = "A professional cybersecurity CLI reconnaissance tool."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "ZeeBountee Security Team", email = "team@zeebountee.local"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    # Core CLI framework and rich terminal output
    "click>=8.1.0",
    "rich>=13.7.0",
    # Modern, async-compatible HTTP client for reconnaissance
    "httpx>=0.27.0",
    # Templating for HTML reports
    "jinja2>=3.1.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.9.0",
    "ruff>=0.3.0",
]

[project.scripts]
zeebountee = "zeebountee.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["zeebountee*"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.mypy]
strict = true
python_version = "3.10"
ignore_missing_imports = true
